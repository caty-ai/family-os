<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">The time axis Family OS designs for</title>
  <desc id="desc">Four narrative bands: today, two to five years, twenty years, and one hundred years. This is not an implementation-state display.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .band { fill: #eaeef2; stroke: #57606a; stroke-width: 3; }
      .focus { stroke: #d97706; stroke-width: 4; }
      .axis { fill: none; stroke: #57606a; stroke-width: 3; marker-end: url(#arrow); }
      .time { fill: #24292f; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .phrase { fill: #24292f; font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .note { fill: #24292f; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1280" height="360" rx="16" fill="#f6f8fa"/>
  <path class="axis" d="M75 200 H1210"/>

  <rect class="band focus" x="45" y="75" width="270" height="105" rx="12"/>
  <text class="time" x="180" y="112">TODAY</text>
  <text class="phrase" x="180" y="148">Models replaceable</text>

  <rect class="band" x="350" y="75" width="270" height="105" rx="12"/>
  <text class="time" x="485" y="112">2–5 YEARS</text>
  <text class="phrase" x="485" y="148">Protocols outlive tools</text>

  <rect class="band" x="655" y="75" width="270" height="105" rx="12"/>
  <text class="time" x="790" y="112">20 YEARS</text>
  <text class="phrase" x="790" y="148">Relationships carried</text>

  <rect class="band" x="960" y="75" width="270" height="105" rx="12"/>
  <text class="time" x="1095" y="112">100 YEARS</text>
  <text class="phrase" x="1095" y="148">Culture — hypothesis</text>

  <text class="note" x="640" y="285">narrative map — not an implementation-state display</text>
  <text class="note" x="640" y="318">Definitions and classes: see the table below the figure</text>
</svg>

name: History Check
on:
  pull_request:
permissions: {contents: read}
concurrency: {group: 'history-check-${{ github.event.pull_request.number }}', cancel-in-progress: true}
jobs:
  history-check:
    uses: caty-ai/family-dev-handbook/.github/workflows/reusable-history-check.yml@ci-v1
    permissions: {contents: read}
